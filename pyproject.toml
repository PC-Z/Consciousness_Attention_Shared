[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "attention-alignment"
version = "0.1.0"
description = "Auditable multimodal alignment for the attention oddball experiment"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "av>=13,<17",
  "h5py>=3.11,<4",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<4",
  "pyarrow>=16,<24",
  "PyYAML>=6,<7",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29,<8",
  "ipympl>=0.9,<1",
  "ipywidgets>=8.1,<9",
  "jupyterlab>=4.2,<5",
]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
attention-align = "attention_alignment.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/attention_alignment"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: reads the workspace's real experiment files",
]
