# Metadata-only manifest for the separate cloud data repository.
# Do not put raw data, access tokens, or local absolute paths in this file.
schema_version: 1
manifest_version: 2026-08-19
data_repository: attention-experiment-data

sessions:
  - id: replace_with_session_id
    condition_label_ms: 1000
    authorization_group: replace_with_group
    status: received | aligned | pupil_qc | neural_qc
    files:
      # Raw inputs. Keep the camera videos when collaborators must review or
      # improve ROI/manual-anchor annotations.
      - relative_path: data/<id>/eeg/01.txt
        kind: ephys_timestamp
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: data/<id>/eeg/02.txt
        kind: ephys_timestamp
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: data/<id>/eeg/01.mp4
        kind: behavior_video
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: data/<id>/eeg/02.mp4
        kind: behavior_video
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: data/<id>/wholebrain_output_after_rejection.mat
        kind: calcium_matrix
        sha256: replace_with_sha256
        size_bytes: 0

      # Derived alignment state already generated by Notebook 01.
      - relative_path: outputs/<id>/stimulus_events.parquet
        kind: stimulus_alignment
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: outputs/<id>/calcium_frames.parquet
        kind: calcium_frame_alignment
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: outputs/<id>/video_frames_01.parquet
        kind: video_frame_alignment
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: outputs/<id>/video_frames_02.parquet
        kind: video_frame_alignment
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: outputs/<id>/manifest.json
        kind: alignment_manifest
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: outputs/<id>/qc.json
        kind: alignment_qc
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: outputs/<id>/ephys_02_manifest.json
        kind: ephys_alignment_manifest
        sha256: replace_with_sha256
        size_bytes: 0

      # Reviewed annotations and outputs. Version annotation files; do not
      # overwrite a collaborator's previous ROI/manual-anchor state.
      - relative_path: annotations/<id>/rois_<date>_<author>.yaml
        kind: roi_and_manual_pupil_annotations
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: outputs/<id>/behavior_01.parquet
        kind: pupil_and_behavior_trace
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: outputs/<id>/pupil_analysis_v2_session_z/analysis_parameters.json
        kind: pupil_analysis_parameters
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: outputs/<id>/pupil_analysis_v2_session_z/train_p5_minus_p4_traces.parquet
        kind: pupil_analysis_trace
        sha256: replace_with_sha256
        size_bytes: 0
      - relative_path: outputs/<id>/pupil_analysis_v2_session_z/test_p5_minus_p4_traces.parquet
        kind: pupil_analysis_trace
        sha256: replace_with_sha256
        size_bytes: 0

notes:
  - "Use repository-relative paths only."
  - "Store videos and calcium matrices outside GitHub."
